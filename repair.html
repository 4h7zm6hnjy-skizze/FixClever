<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FixClever – Start reparieren</title>
<style>
body{margin:0;background:#f3f8f5;color:#143e34;font:17px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:22px}
main{max-width:580px;margin:12vh auto;background:#fff;border-radius:20px;padding:26px;box-shadow:0 12px 38px #163e341c}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}button,a{display:inline-block;border:0;border-radius:9px;background:#167459;color:white;padding:11px 18px;font-weight:750;font:inherit;text-decoration:none;cursor:pointer}
p{margin:10px 0 18px}small{color:#50695e}
</style>
</head>
<body><main>
<h1>FixClever reparieren</h1>
<p id="status">Alten Programm-Cache entfernen …</p>
<small>Deine Profile, Testergebnisse und Lernstatistiken bleiben erhalten. Diese Seite entfernt ausschließlich den FixClever-Dateicache und deaktiviert den alten Service Worker.</small>
<p><button id="go" type="button" hidden>FixClever öffnen</button></p>
</main>
<script>
(async()=>{
 const status=document.getElementById('status'),go=document.getElementById('go');
 try{
  // Do NOT clear localStorage or indexedDB, which contain user data.
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   for(const reg of regs){
    if(reg.scope.startsWith(new URL('./',location.href).href))await reg.unregister();
   }
  }
  if('caches' in window){
   const names=await caches.keys();
   await Promise.all(names.filter(name=>name.startsWith('fixclever-')).map(name=>caches.delete(name)));
  }
  status.textContent='Der alte Programm-Cache ist entfernt. FixClever kann jetzt die aktuellen Dateien laden.';
 }catch(e){status.textContent='Automatische Bereinigung war nicht vollständig: '+e.message+' – Du kannst trotzdem die App neu öffnen.';}
 go.hidden=false;
 go.onclick=()=>location.replace('./index.html?fixclever_neustart='+Date.now());
})();
</script></body></html>
